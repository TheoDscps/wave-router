name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    # WPF/WinForms — needs the Windows runner, not Linux.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish self-contained single-file build
        run: >
          dotnet publish src/WaveRouter/WaveRouter.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish

      - name: Zip the build
        env:
          TAG: ${{ github.ref_name }}
        run: Compress-Archive -Path publish\WaveRouter.exe -DestinationPath "WaveRouter-$env:TAG-win-x64.zip"
        shell: pwsh

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$env:TAG" "WaveRouter-$env:TAG-win-x64.zip" --title "WaveRouter $env:TAG" --generate-notes
        shell: pwsh
